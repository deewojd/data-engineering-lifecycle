resources:
  jobs:
    daily_sales_pipeline_databricks:
      name: daily_sales_pipeline_databricks

      tasks:
        - task_key: daily_sales_pipeline
          notebook_task:
            notebook_path: databricks/daily_sales_pipeline
            source: GIT

          environment_key: Default

      git_source:
        git_url: https://github.com/deewojd/data-engineering-lifecycle.git
        git_provider: gitHub
        git_branch: main

      queue:
        enabled: true

      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
